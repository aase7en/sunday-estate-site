    <!-- JOBS/073 - boot error trap (diagnostic; dev-team audience, English only).
         First script in the document: captures JS exceptions, resource-load
         failures and unhandled rejections even when every other resource is
         broken, renders them in a plain banner, and exposes
         window.__SE_BOOT_ERRORS. Deliberate design-token exemption: this file
         sits outside the component/token system and the banner must render
         with zero external dependencies (inline attribute styles, CSS color
         keywords, no hex/px). JOBS/073 job file documents the rationale. -->
    <script>
      (function () {
        var errors = (window.__SE_BOOT_ERRORS = []);
        var pre = null;
        function render() {
          var bootOk = window.__SE_BOOT_OK;
          var lines = ["BOOT ERROR"];
          for (var i = 0; i < errors.length; i++) lines.push(errors[i]);
          lines.push("URL: " + location.href);
          lines.push("UA: " + navigator.userAgent);
          lines.push(
            "BOOT_OK: " +
              (bootOk ? "set - bundle started (" + bootOk + ")" : "NOT set - bundle never loaded"),
          );
          if (!pre) {
            pre = document.createElement("pre");
            pre.id = "se-boot-error";
            pre.setAttribute(
              "style",
              "position:fixed;top:0;left:0;right:0;margin:0;padding:8px;background:yellow;color:black;font-family:monospace;font-size:small;line-height:1.4;z-index:2147483647;white-space:pre-wrap;word-break:break-word;",
            );
            (document.body || document.documentElement).appendChild(pre);
          }
          pre.textContent = lines.join("\n");
        }
        function capture(line) {
          if (errors.length < 20) errors.push(line);
          render();
        }
        window.addEventListener(
          "error",
          function (event) {
            var t = event.target;
            if (t && t.tagName && t !== window) {
              capture("RESOURCE " + t.tagName + " failed: " + (t.src || t.href || "(no url)"));
            } else {
              var e = event.error || event;
              capture(
                "JS " +
                  ((e && e.message) || event.message || String(e)) +
                  " @ " +
                  (event.filename || "?") +
                  ":" +
                  (event.lineno || "?"),
              );
            }
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (event) {
          var r = event.reason;
          capture("PROMISE " + ((r && r.message) || String(r)));
        });
      })();
    </script>
